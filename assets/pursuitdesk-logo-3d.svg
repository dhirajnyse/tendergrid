<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">PursuitDesk 3D logo</title>
  <desc id="desc">A corporate 3D PD monogram above the PursuitDesk wordmark.</desc>
  <defs>
    <linearGradient id="deep" x1="240" y1="145" x2="690" y2="540" gradientUnits="userSpaceOnUse">
