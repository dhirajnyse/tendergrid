      <stop offset="0" stop-color="#edf1ee"/>
      <stop offset="1" stop-color="#e1ded1"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" rx="18" fill="url(#ground)"/>
  <rect x="24" y="24" width="912" height="552" rx="14" fill="url(#grid)" opacity=".86"/>
  <path d="M88 446 C176 390 180 292 268 274 C369 253 410 349 507 312 C625 267 612 139 731 126 C789 120 840 144 884 171" fill="none" stroke="#232a31" stroke-width="42" stroke-linecap="round"/>
